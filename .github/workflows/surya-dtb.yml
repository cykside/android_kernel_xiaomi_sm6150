name: Surya DTB smoke test

on:
  pull_request:
    branches: [seventeen-6.1]

concurrency:
  group: surya-bringup-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  surya-dtb:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld flex bison bc libelf-dev libssl-dev device-tree-compiler python3-libfdt
      - name: Test offline stock DT audit with synthetic inputs
        run: scripts/dtc/test-surya-stock-audit.sh
      - name: Configure Surya and verify the fragment
        run: |
          make O=out/surya ARCH=arm64 LLVM=1 gki_defconfig vendor/surya.config
          missing=0
          while IFS= read -r setting; do
            case "$setting" in CONFIG_*=*) ;; *) continue ;; esac
            if ! grep -Fxq -- "$setting" out/surya/.config; then
              symbol=${setting%%=*}
              actual=$(grep -E "^${symbol}=|^# ${symbol} is not set$" out/surya/.config || true)
              echo "::error file=arch/arm64/configs/vendor/surya.config::Expected $setting; resolved: ${actual:-absent}"
              missing=1
            fi
          done < arch/arm64/configs/vendor/surya.config
          test "$missing" -eq 0
      - name: Build and check the board DTB
        run: |
          make -j2 O=out/surya ARCH=arm64 LLVM=1 vendor/qcom/surya-sm6150.dtb vendor/qcom/violet-sm6150.dtb
          dtb=out/surya/arch/arm64/boot/dts/vendor/qcom/surya-sm6150.dtb
          test "$(fdtget -t s "$dtb" / compatible)" = 'xiaomi,surya qcom,sm6150'
          test "$(fdtget -t u "$dtb" / qcom,msm-id)" = '365 0'
          test "$(fdtget -t u "$dtb" / qcom,board-id)" = '34 0'
          pstore=/reserved-memory/ramoops@9d800000
          test "$(fdtget -t x "$dtb" "$pstore" reg)" = '0 9d800000 0 400000'
          test "$(fdtget -t x "$dtb" "$pstore" record-size)" = '80000'
          test "$(fdtget -t x "$dtb" "$pstore" pmsg-size)" = '200000'
          test "$(fdtget -t x "$dtb" "$pstore" console-size)" = '100000'
          for node in /soc/ufshc@1d84000 /soc/ufsphy_mem@1d87000 \
                      /soc/ssusb@a600000 /soc/hsusb@a800000; do
            test "$(fdtget -t s "$dtb" "$node" status)" = disabled
          done
          if fdtget "$dtb" /soc/ufshc@1d84000 reset-gpios >/dev/null 2>&1; then
            echo 'Surya UFS must not inherit the SM6150 reset GPIO' >&2
            exit 1
          fi
          pdphy=/soc/qcom,spmi@c440000/pmic@0/usb-pdphy@1700
          test "$(fdtget -t x "$dtb" "$pdphy" reg)" = '1700'
          test "$(fdtget -t s "$dtb" "$pdphy" status)" = disabled
          pmic=${pdphy%/*}
          test "$(fdtget -t s "$dtb" "$pmic/charger" status)" = disabled
          test "$(fdtget -t s "$dtb" "$pmic/charger" compatible)" = 'qcom,pm6150-smb5'
          test "$(fdtget -t s "$dtb" "$pmic/adc@3100" status)" = disabled
          test "$(fdtget -t s "$dtb" "$pmic/charger" io-channel-names)" = \
            'usb_in_voltage usb_in_current chg_temp die_temp conn_temp sbux_res vph_voltage resistance_id voltage_now temp capacity voltage_ocv voltage_avg debug_battery real_capacity cc_soc current_now voltage_max charge_full charge_counter cycle_count charge_full_design time_to_full_now'
          conn_adc=${pmic%/*}/pmic@4/adc@3100
          test "$(fdtget -t s "$dtb" "$conn_adc" status)" = disabled
          test "$(fdtget -t x "$dtb" "$conn_adc/channel@4d" reg)" = 4d
          for table in thermal-mitigation thermal-mitigation-icl thermal-mitigation-dcp \
                       thermal-mitigation-qc2 thermal-fcc-qc3-normal thermal-mitigation-pd-base; do
            values=$(fdtget -t u "$dtb" "$pmic/charger" "qcom,$table")
            awk 'NF != 16 { exit 1 } { for (i = 2; i <= NF; i++) if ($i > $(i-1)) exit 1 }' <<< "$values"
          done
          gauge=$pmic/fuel-gauge
          test "$(fdtget -t s "$dtb" "$gauge" status)" = disabled
          test "$(fdtget -t s "$dtb" "$gauge" io-channel-names)" = 'batt-therm batt-id input_current_limited recharge_soc force_recharge charge_done'
          test "$(fdtget -t x "$dtb" "$gauge/qcom,qgauge@4800" reg)" = 4800
          test "$(fdtget -t x "$dtb" "$gauge/qcom,qg-sdam@b600" reg)" = b600
          charger_phandle=$(fdtget -t x "$dtb" "$pmic/charger" phandle)
          gauge_phandle=$(fdtget -t x "$dtb" "$gauge" phandle)
          gauge_inputs=$(fdtget -t x "$dtb" "$gauge" io-channels)
          charger_inputs=$(fdtget -t x "$dtb" "$pmic/charger" io-channels)
          awk -v provider="$charger_phandle" '
            NF != 12 { exit 1 }
            { for (i = 5; i <= NF; i += 2) if ($i != provider) exit 1 }
          ' <<< "$gauge_inputs"
          awk -v provider="$gauge_phandle" '
            NF != 46 { exit 1 }
            { for (i = 15; i <= NF; i += 2) if ($i != provider) exit 1 }
          ' <<< "$charger_inputs"
      - name: Compile the staged power, USB and UFS drivers
        run: |
          make -j"$(nproc)" O=out/surya ARCH=arm64 LLVM=1 \
            drivers/power/supply/qcom/built-in.a \
            drivers/usb/pd/built-in.a \
            drivers/usb/dwc3/dwc3-msm-core.o \
            drivers/iio/adc/qcom-spmi-adc5.o \
            drivers/ufs/host/ufs-qcom.o \
            drivers/phy/qualcomm/phy-qcom-ufs-qmp-v3.o \
            drivers/regulator/qpnp-lcdb-regulator.o \
            drivers/video/backlight/qcom-spmi-wled.o \
            drivers/pinctrl/qcom/pinctrl-sdmmagpie.o
      - name: Verify staged NT36672C panel data
        run: |
          dtb=out/surya/arch/arm64/boot/dts/vendor/qcom/surya-sm6150.dtb
          test "$(fdtget -t s "$dtb" /soc/qcom,mdss_mdp@ae00000 status)" = disabled
          test "$(fdtget -t s "$dtb" /soc/qcom,dsi-display-primary status)" = disabled
          pmic_gpio=/soc/qcom,spmi@c440000/pmic@4/pinctrl@c000
          test "$(fdtget -t s "$dtb" "$pmic_gpio" status)" = disabled
          pmic_gpio_phandle=$(fdtget -t u "$dtb" "$pmic_gpio" phandle)
          for vendor in huaxing tianma; do
            panel=/soc/qcom,mdss_mdp@ae00000/qcom,mdss_dsi_nt36672c_${vendor}_fhd_video
            timing=$panel/qcom,mdss-dsi-display-timings/timing@0
            test "$(fdtget -t s "$dtb" "$panel" status)" = disabled
            test "$(fdtget -t u "$dtb" "$panel" qcom,platform-reset-gpio)" = "$pmic_gpio_phandle 9 0"
            te=$(fdtget -t u "$dtb" "$panel" qcom,platform-te-gpio)
            test "${te#* }" = '10 0'
            test "$(fdtget -t u "$dtb" "$timing" qcom,mdss-dsi-panel-width)" = 1080
            test "$(fdtget -t u "$dtb" "$timing" qcom,mdss-dsi-panel-height)" = 2400
            test "$(fdtget -t u "$dtb" "$timing" qcom,mdss-dsi-panel-framerate)" = 120
            test -n "$(fdtget -t bx "$dtb" "$timing" qcom,mdss-dsi-on-command)"
          done
          display_pmic=/soc/qcom,spmi@c440000/pmic@5
          test "$(fdtget -t s "$dtb" "$display_pmic/qcom,wled@d800" status)" = disabled
          test "$(fdtget -t u "$dtb" "$display_pmic/qcom,wled@d800" qcom,string-cfg)" = 7
          test "$(fdtget -t s "$dtb" "$display_pmic/qcom,lcdb@ec00" status)" = disabled
          for rail in ldo ncp bst; do
            test "$(fdtget -t s "$dtb" "$display_pmic/qcom,lcdb@ec00/$rail" regulator-name)" = "lcdb_$rail"
          done
          supplies=/soc/qcom,mdss_mdp@ae00000/panel-supply-entries
          supply_phandle=$(fdtget -t u "$dtb" "$supplies" phandle)
          test "$(fdtget -t u "$dtb" "$supplies/qcom,panel-supply-entry@2" qcom,supply-post-on-sleep)" = 20
          for vendor in huaxing tianma; do
            panel=/soc/qcom,mdss_mdp@ae00000/qcom,mdss_dsi_nt36672c_${vendor}_fhd_video
            test "$(fdtget -t u "$dtb" "$panel" qcom,panel-supply-entries)" = "$supply_phandle"
            test "$(fdtget -t u "$dtb" "$panel" qcom,dsi-ctrl-num)" = 0
            test "$(fdtget -t u "$dtb" "$panel" qcom,dsi-phy-num)" = 0
          done
          for vendor in huaxing tianma; do
            panel=/soc/qcom,mdss_mdp@ae00000/qcom,mdss_dsi_nt36672c_${vendor}_fhd_video
            timing=$panel/qcom,mdss-dsi-display-timings/timing@0
            test "$(fdtget -t u "$dtb" "$timing" qcom,display-topology)" = '1 1 1'
            test "$(fdtget -t s "$dtb" "$timing" qcom,compression-mode)" = dsc
            test "$(fdtget -t x "$dtb" "$panel" qcom,mdss-dsi-t-clk-pre)" = 26
            test "$(fdtget -t x "$dtb" "$panel" qcom,mdss-dsi-t-clk-post)" = 4
          done
      - name: Compile the SM6150 display stack
        run: |
          make -j"$(nproc)" O=out/surya ARCH=arm64 LLVM=1 \
            techpack/display/built-in.a drivers/clk/qcom/dispcc-sm6150.o
      - name: Verify staged touch bus and compile GENI SPI
        run: |
          dtb=out/surya/arch/arm64/boot/dts/vendor/qcom/surya-sm6150.dtb
          bus=/soc/qcom,qupv3_0_geni_se@8c0000/spi@880000
          touch=$bus/touchscreen@0
          test "$(fdtget -t s "$dtb" "$bus" status)" = disabled
          test "$(fdtget -t s "$dtb" "$touch" status)" = disabled
          test "$(fdtget -t s "$dtb" "$touch" compatible)" = 'novatek,NVT-ts-spi'
          test "$(fdtget -t u "$dtb" "$touch" spi-max-frequency)" = 19200000
          make -j"$(nproc)" O=out/surya ARCH=arm64 LLVM=1 drivers/spi/spi-msm-geni.o
      - name: Verify staged haptic wiring
        run: |
          dtb=out/surya/arch/arm64/boot/dts/vendor/qcom/surya-sm6150.dtb
          bus=/soc/qcom,qupv3_0_geni_se@8c0000/i2c@884000
          haptic=$bus/haptic@5a
          test "$(fdtget -t s "$dtb" "$bus" status)" = disabled
          test "$(fdtget -t s "$dtb" "$haptic" status)" = disabled
          test "$(fdtget -t x "$dtb" "$haptic" reg)" = 5a
          test "$(fdtget -t s "$dtb" "$haptic" compatible)" = 'awinic,aw8624_haptic ti,drv2624'
          reset=$(fdtget -t u "$dtb" "$haptic" reset-gpio)
          irq=$(fdtget -t u "$dtb" "$haptic" irq-gpio)
          test "${reset#* }" = '63 0'
          test "${irq#* }" = '26 0'

      - name: Verify staged NFC and compile GENI I2C
        run: |
          dtb=out/surya/arch/arm64/boot/dts/vendor/qcom/surya-sm6150.dtb
          bus=/soc/qcom,qupv3_0_geni_se@8c0000/i2c@888000
          nfc=$bus/nfc@28
          test "$(fdtget -t s "$dtb" "$bus" status)" = disabled
          test "$(fdtget -t s "$dtb" "$nfc" status)" = disabled
          test "$(fdtget -t s "$dtb" "$nfc" compatible)" = 'qcom,nq-nci'
          test "$(fdtget -t x "$dtb" "$nfc" reg)" = 28
          test "$(fdtget -t u "$dtb" "$nfc" interrupts)" = '37 0'
          ese=$(fdtget -t u "$dtb" "$nfc" qcom,nq-esepwr)
          test "${ese#* }" = '22 0'
          make -j"$(nproc)" O=out/surya ARCH=arm64 LLVM=1 drivers/i2c/busses/i2c-msm-geni.o

      - name: Verify staged SDMMagpie pinctrl states
        run: |
          dtb=out/surya/arch/arm64/boot/dts/vendor/qcom/surya-sm6150.dtb
          tlmm=/soc/pinctrl@03000000
          test "$(fdtget -t s "$dtb" "$tlmm" compatible)" = 'qcom,sm6150-pinctrl'
          test "$(fdtget -t s "$dtb" "$tlmm/surya-te-state" pins)" = gpio10
          test "$(fdtget -t s "$dtb" "$tlmm/surya-te-state" function)" = mdp_vsync
          test "$(fdtget -t s "$dtb" "$tlmm/surya-touch-spi-active-state" pins)" = 'gpio49 gpio50 gpio51 gpio52'
          test "$(fdtget -t s "$dtb" "$tlmm/surya-touch-spi-active-state" function)" = qup00
          test "$(fdtget -t s "$dtb" "$tlmm/surya-nfc-i2c-active-state" pins)" = 'gpio34 gpio35'
          test "$(fdtget -t s "$dtb" "$tlmm/surya-nfc-i2c-active-state" function)" = qup02

      - name: Compile the offline SDMMagpie TLMM audit DTB
        run: |
          make -j2 O=out/surya ARCH=arm64 LLVM=1 vendor/qcom/surya-sm6150-tlmm-audit.dtb
          dtb=out/surya/arch/arm64/boot/dts/vendor/qcom/surya-sm6150-tlmm-audit.dtb
          tlmm=/soc/pinctrl@3400000
          test "$(fdtget -t s "$dtb" "$tlmm" compatible)" = 'qcom,sdmmagpie-pinctrl'
          test "$(fdtget -t x "$dtb" "$tlmm" reg)" = '3400000 dc2000 17c000f0 60'
          test "$(fdtget -t u "$dtb" "$tlmm" interrupts)" = '0 208 4'
          test "$(fdtget -t s "$dtb" "$tlmm" status)" = disabled
          test "$(fdtget -t s "$dtb" /soc/ufshc@1d84000 status)" = disabled
          test "$(fdtget -t s "$dtb" /soc/ufshc@1d84000 pinctrl-names)" = 'dev-reset-assert dev-reset-deassert'
          ufs=/soc/ufshc@1d84000
          for index in 0 1; do
            if [ "$index" = 0 ]; then
              state="$tlmm/ufs_dev_reset_assert"
              level=output-low
            else
              state="$tlmm/ufs_dev_reset_deassert"
              level=output-high
            fi
            test "$(fdtget -t x "$dtb" "$ufs" "pinctrl-$index")" = "$(fdtget -t x "$dtb" "$state" phandle)"
            test "$(fdtget -t s "$dtb" "$state/config" pins)" = ufs_reset
            fdtget "$dtb" "$state/config" "$level" >/dev/null
          done
          uart=/soc/qcom,qupv3_0_geni_se@8c0000/qcom,qup_uart@0x880000
          test "$(fdtget -t s "$dtb" "$uart" status)" = disabled
          /usr/bin/python3 scripts/dtc/surya-tlmm-users.py "$dtb" "$tlmm" > "$RUNNER_TEMP/surya-tlmm-users.tsv"
          cat "$RUNNER_TEMP/surya-tlmm-users.tsv"
          grep -Fq $'disabled\t'"$uart"$'\tpinctrl-0\t' "$RUNNER_TEMP/surya-tlmm-users.tsv"

      - uses: actions/upload-artifact@v4
        with:
          name: surya-dtb-for-audit
          path: out/surya/arch/arm64/boot/dts/vendor/qcom/surya-sm6150.dtb
          if-no-files-found: error
          retention-days: 3

  surya-stock-dt-audit:
    needs: surya-dtb
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: surya-dtb-for-audit
          path: out/surya-dtb-for-audit
      - name: Install offline device tree tools
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler python3-libfdt
      - name: Compare against the pinned MIUI 14.0.1 stock dump
        run: |
          dump=https://gitlab.com/Android-Dumps/poco/surya/-/raw/47617823f73a3288ee5d42c611e0e22a339512ab
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          curl --fail --show-error --silent --location --retry 2 --max-time 60 \
            "$dump/bootimg/12_dtbdump_Qualcomm_Technologies,_Inc._SDMMAGPIE_SoC.dtb" \
            -o "$work/base.dtb"
          curl --fail --show-error --silent --location --retry 2 --max-time 60 \
            "$dump/dtbodts/16_dtbdump_qcom,sdmmagpie-idp.dts" \
            -o "$work/idp.dts"
          scripts/dtc/surya-stock-audit.sh "$work/base.dtb" "$work/idp.dts" "$work/report"
          /usr/bin/python3 scripts/dtc/surya-tlmm-users.py \
            "$work/report/stock-surya-merged.dtb" /soc/pinctrl@3400000 > "$work/tlmm-users.tsv"
          /usr/bin/python3 scripts/dtc/surya-reserved-memory-diff.py \
            "$work/report/stock-surya-merged.dtb" \
            out/surya-dtb-for-audit/surya-sm6150.dtb > "$work/reserved-memory-diff.txt"
          {
            for tree in "$work/report/stock-surya-merged.dtb" out/surya-dtb-for-audit/surya-sm6150.dtb; do
              printf '\n%s\n' "$(basename "$tree")"
              for node in /soc/ufshc@1d84000 /soc/ufsphy_mem@1d87000; do
                printf '%s\n' "$node"
                for property in reg interrupts lanes-per-direction reset-gpios; do
                  value=$(fdtget -t x "$tree" "$node" "$property" 2>/dev/null || echo absent)
                  printf '  %s: %s\n' "$property" "$value"
                done
                for property in compatible status boot_device_type pinctrl-names reset-names nvmem-cell-names; do
                  value=$(fdtget -t s "$tree" "$node" "$property" 2>/dev/null || echo absent)
                  printf '  %s: %s\n' "$property" "$value"
                done
              done
            done
          } > "$work/ufs-comparison.txt"
          grep '^partial overlap:' "$work/reserved-memory-diff.txt" | head -n 20 | while IFS= read -r line; do
            printf '::notice title=Surya reserved memory::%s\n' "${line//%/%25}"
          done || true
          {
            echo '### MIUI 14.0.1 stock device tree audit (offline)'
            printf '\n```text\n'
            cat "$work/report/stock-surya-summary.txt"
            printf '\nReserved memory comparison against Linux 6.1:\n'
            cat "$work/reserved-memory-diff.txt"
            printf '\nUFS controller and PHY comparison:\n'
            cat "$work/ufs-comparison.txt"
            printf '```\n\n<details><summary>TLMM consumers</summary>\n\n```text\n'
            cat "$work/tlmm-users.tsv"
            printf '```\n\n</details>\n'
          } >> "$GITHUB_STEP_SUMMARY"

  surya-kernel-image:
    needs: surya-dtb
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/surya-ccache
      CCACHE_MAXSIZE: 600M
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld flex bison bc libelf-dev libssl-dev dwarves ccache
      - uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: surya-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: surya-ccache-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Resolve the Surya configuration
        run: make O=out/surya ARCH=arm64 LLVM=1 gki_defconfig vendor/surya.config
      - name: Link the arm64 kernel and build Image.gz
        run: |
          log="$RUNNER_TEMP/surya-kernel-build.log"
          set -o pipefail
          if ! make -j"$(nproc)" O=out/surya ARCH=arm64 LLVM=1 CC="ccache clang" Image.gz 2>&1 | tee "$log"; then
            grep -im 12 -E 'error:|undefined (symbol|reference)|no rule to make target|killed|fatal:' "$log" \
              | while IFS= read -r line; do
                  line=${line//%/%25}
                  printf '::error::%s\n' "$line"
                done || true
            exit 1
          fi
          test -s out/surya/vmlinux
          test -s out/surya/arch/arm64/boot/Image.gz
          gzip -t out/surya/arch/arm64/boot/Image.gz
      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats
